<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Conecta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a href="index.html" class="link-voltar">← Início</a>
      <span class="logo">Conecta</span>
    </div>
  </header>

  <main class="container">
    <section class="quiz-box">
      <div class="progresso-topo">
        <span id="contador-pergunta">Pergunta 1 de 4</span>
        <span id="porcentagem-progresso" class="progresso-porcentagem">25%</span>
      </div>
      <div class="barra-fundo">
        <div id="barra-progresso" class="barra-preenchimento"></div>
      </div>

      <h1 id="texto-pergunta">Carregando pergunta...</h1>
      <div id="opcoes-container" class="opcoes-lista"></div>

      <div class="quiz-acoes">
        <button id="btn-anterior" class="btn-secundario">Voltar</button>
        <div class="quiz-acoes-direita">
          <button id="btn-reiniciar" class="btn-secundario">Reiniciar</button>
          <button id="btn-proxima" class="btn-principal">Próxima</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/quiz.js"></script>
</body>
</html>
